  <circle cx="24" cy="24" r="5" stroke="#E8A2A8" stroke-width="1" stroke-dasharray="2 1.5" fill="none"/>

  <!-- Central Vigilant Pupil -->
  <circle cx="24" cy="24" r="3" fill="#F2F2F2"/>
  <circle cx="25.5" cy="22.5" r="1.1" fill="#42161B"/>
