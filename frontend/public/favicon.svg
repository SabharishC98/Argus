<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Argus Panoptes Circular Badge -->
  <circle cx="24" cy="24" r="23" fill="#42161B" stroke="#67242B" stroke-width="2"/>
  <circle cx="24" cy="24" r="20" stroke="#8C323B" stroke-width="0.75" stroke-dasharray="3 2" stroke-opacity="0.6"/>

  <!-- Celestial Cardinal Rays -->
  <line x1="24" y1="4" x2="24" y2="8" stroke="#F2F2F2" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="24" y2="44" stroke="#F2F2F2" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="4" y1="24" x2="8" y2="24" stroke="#F2F2F2" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="44" y2="24" stroke="#F2F2F2" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Argus Panoptes Watchful Eye Contour -->
  <path d="M7 24 C13 13, 35 13, 41 24 C35 35, 13 35, 7 24 Z" stroke="#F2F2F2" stroke-width="2.2" stroke-linejoin="round" fill="none"/>

  <!-- Concentric Iris Astrolabe Ring -->
