version: '3.8'

services:
  # FalkorDB Primary Graph Database (port 6379)
  falkordb:
    image: falkordb/falkordb:latest
    container_name: shadowlens-falkordb
    ports:
      - "6379:6379" # FalkorDB openCypher graph port
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ShadowLens-Agent Backend API & MCP Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: shadowlens-backend
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH=shadowlens
      - FALKORDB_ENABLED=true
      - DEFAULT_PIPELINE_MODEL=gemini/gemini-2.0-flash
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  # ShadowLens-Agent Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: shadowlens-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
