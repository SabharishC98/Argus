services:
  # Argus Backend API (FastAPI + Embedded FalkorDB Cypher Engine)
  - type: web
    name: argus-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    region: oregon
    envVars:
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"
      - key: FALKORDB_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # Argus Frontend UI (Vite + React)
  - type: web
    name: argus-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: argus-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
